<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<title>Luanti Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<div id="shade"></div>
<main class="shell">
  <header class="top">
    <div class="brand"><span class="cube"></span><span class="name">LUANTI <b>LAUNCHER</b></span></div>
    <div id="install" class="pill"></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="play" class="tab active">Play</button>
    <button data-tab="mods" class="tab">Mods</button>
    <button data-tab="updates" class="tab">Updates</button>
    <button data-tab="contentdb" class="tab" hidden>ContentDB</button>
    <button data-tab="folders" class="tab">Folders</button>
    <button data-tab="settings" class="tab">Settings</button>
  </nav>
  <section id="view" class="view"></section>
  <div id="toast" class="toast" hidden></div>
</main>
<script src="app.js"></script>
</body>
</html>
